- main:
  - button "Clear chat": Clear
  - group "Interface language":
    - button "中文"
    - button "English" [pressed]: EN
  - button "Little Buddy, at ease"
  - button "Rename, now called Little Buddy": Little Buddy
  - button "Read replies aloud" [pressed]
  - log "Chat":
    - listitem: Hi.
    - listitem: Hello! How's your day going?
    - listitem: Long day.
    - listitem: I heard about your long day after our first hello, and I hope you're feeling better now. Want to talk about it?
    - listitem: Tea now.
    - listitem: That tea sounds perfect after such a long day! Do you have any plans for the evening?
    - listitem: My boss praised me.
    - listitem: That praise must taste even sweeter with your warm tea! Did he say anything specific about what you did well?
    - listitem: I missed dinner.
    - listitem: Your boss's praise made that skipped dinner feel like a celebration too! Was the meeting late or early?
    - listitem: They were good.
    - listitem: That's wonderful news about the meeting being good, so you probably didn't miss out on much since it was successful! Did you manage to grab a quick bite later?
    - listitem: She sounds well.
    - listitem: I'm glad she's doing well too, especially after that good meeting! Do you feel like celebrating now?
    - listitem: Maybe a walk tomorrow.
    - listitem: That sounds lovely for when she is feeling better! Maybe we can join her on the walk later.
    - listitem: I like comedies.
    - listitem: A comedy walk sounds like a perfect idea! Will you bring snacks?
    - listitem: Thanks.
    - listitem: You're welcome! I hope that comedy walk tomorrow is just as fun as it sounds.
    - listitem: Good night.
    - listitem: Little Buddy is replying
  - status
  - textbox "What you want to tell Little Buddy":
    - /placeholder: Or type, Enter sends
  - button "Hold to talk" [disabled]