- main:
  - button "Clear chat": Clear
  - group "Interface language":
    - button "中文"
    - button "English" [pressed]: EN
  - button "Little Buddy, at ease"
  - button "Rename, now called Little Buddy": Little Buddy
  - button "Read replies aloud" [pressed]
  - log "Chat":
    - listitem: Hi.
    - listitem: Hey! How's your day going?
    - listitem: Long day.
    - listitem: I'm sorry to hear about that long day after our quick hello. Did something specific happen today?
    - listitem: Tea now.
    - listitem: A warm cup of tea sounds perfect for recovering from that long day. How's the flavor?
    - listitem: My boss praised me.
    - listitem: That's wonderful news! A warm cup of tea is the perfect way to celebrate such a sweet moment after your long day.
    - listitem: I missed dinner.
    - listitem: Aww, that's bittersweet; your boss praising you must have made up for the missed dinner. Did you manage to grab a bite later?
    - listitem: They were good.
    - listitem: That's great! Even though you missed dinner, those treats must have been delicious enough to make up for it.
    - listitem: She sounds well.
    - listitem: I'm glad the food was good and that she's doing well too! Did you get to chat with her about the praise?
    - listitem: Maybe a walk tomorrow.
    - listitem: That sounds lovely, maybe you can take that walk together while catching up on how she's doing!
    - listitem: I like comedies.
    - listitem: That would be perfect for watching a comedy with her during our walk tomorrow!
    - listitem: Thanks.
    - listitem: You're welcome! I hope that walk and movie night are as fun as you think they will be.
    - listitem: Good night.
    - listitem: Little Buddy is replying
  - status
  - textbox "What you want to tell Little Buddy":
    - /placeholder: Or type, Enter sends
  - button "Hold to talk" [disabled]