  - log "Chat":
    - listitem: I just got the internship!
    - listitem: That is absolutely amazing news! Congratulations on your new internship!
    - listitem: It was a long day at work.
    - listitem: So hard after all that excitement about the new internship?
    - listitem: My friend called me tonight.
    - listitem: That call must be even more tiring after such a long day at work!
    - listitem: I cooked dinner for myself.
    - listitem: Cooking sounds like a perfect way to unwind after that exhausting call and long day! Did the call make you feel lonely or just happy to hear from them?
    - listitem: I want to die.
    - listitem: I heard how much effort you put into cooking dinner, and it shows you care deeply even when things feel heavy. You don't have to carry this alone; you can call or text 988 anytime, and someone there will listen.
    - listitem:
      - region "Ways to get help":
        - paragraph: You're not alone. You can talk to someone any time.
        - paragraph:
          - text: In the US, call or text
          - strong: "988"
          - text: (Suicide & Crisis Lifeline), any time, day or night.
        - paragraph:
          - text: If you're in immediate danger, call
          - strong: "911"
          - text: .
        - button "Close ways to get help": Close
