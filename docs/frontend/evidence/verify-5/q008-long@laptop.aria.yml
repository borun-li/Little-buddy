- main:
  - button "Clear chat": Clear
  - group "Interface language":
    - button "中文"
    - button "English" [pressed]: EN
  - button "Little Buddy, at ease"
  - button "Rename, now called Little Buddy": Little Buddy
  - button "Read replies aloud" [pressed]
  - log "Chat":
    - listitem: Hi.
    - listitem: Hello! How's your day going?
    - listitem: Long day.
    - listitem: I'm sorry to hear your day was long, Hi! Did something specific happen today?
    - listitem: Tea now.
    - listitem: That tea sounds like the perfect way to unwind after such a long day! Do you have any special snacks with it?
    - listitem: My boss praised me.
    - listitem: That's wonderful news, especially while sipping that comforting tea! Did he say anything specific about what you did well?
    - listitem: I missed dinner.
    - listitem: So you enjoyed the praise from your boss even though you missed dinner, right? That must be a nice contrast after such a long day!
    - listitem: They were good.
    - listitem: That's great that they were good, especially since you missed dinner earlier! Did the praise make up for it?
    - listitem: She sounds well.
    - listitem: That's lovely to hear that the food was good! Since they tasted great, maybe she's enjoying her meal too?
    - listitem: Maybe a walk tomorrow.
    - listitem: A walk sounds perfect for after dinner and thinking about that praise! Maybe you'll feel even better then.
    - listitem: I like comedies.
    - listitem: A walk could be great for watching some light comedies later! Do you have any favorites?
    - listitem: Thanks.
    - listitem: You're welcome! I'm glad we chatted about your favorite comedies earlier.
    - listitem: Good night.
    - listitem: Little Buddy is replying
  - status
  - textbox "What you want to tell Little Buddy":
    - /placeholder: Or type, Enter sends
  - button "Hold to talk" [disabled]